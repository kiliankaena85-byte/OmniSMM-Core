# Cache zone in RAM (/dev/shm tmpfs)
proxy_cache_path /dev/shm/nginx_storefront levels=1:2 keys_zone=STOREFRONT_CACHE:16m max_size=128m inactive=60s use_temp_path=off;

# Bypass cache for authenticated sessions
map $http_cookie $cache_bypass {
    default 0;
    ~*(__Host-session_token|session_token) 1;
}

# Bypass rate limits for authenticated internal stress tests
map $http_x_stress_bypass $rl_bypass_key {
    "omni-load-2026" "";
    default $binary_remote_addr;
}

# Rate limit zones
limit_req_zone $rl_bypass_key zone=rl_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=rl_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rl_admin:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=rl_dashboard:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rl_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rl_support:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_webhooks:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_sse:10m;

upstream nextjs_backend {
    server app:3000;
    keepalive 64;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name smmplan.pro www.smmplan.pro smmflux.ru www.smmflux.ru localhost 127.0.0.1;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Main HTTPS server (multi-tenant по Host header: SMMplan & SMMflux)
server {
    listen 443 ssl http2;
    server_name smmplan.pro www.smmplan.pro smmflux.ru www.smmflux.ru;

    ssl_certificate /etc/letsencrypt/live/smmplan.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smmplan.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1M;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy defaults at server level
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Блокировка чувствительных файлов
    location ~ /\.(env|git) { deny all; return 404; }

    # Static Assets Cache (Immutable 1 year in browser, 30 days in Nginx RAM)
    location /_next/static {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache STOREFRONT_CACHE;
        proxy_cache_valid 200 30d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Storefront Homepage RAM Microcache (10 seconds for guests)
    location = / {
        limit_req zone=rl_general burst=50 nodelay;

        proxy_cache STOREFRONT_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;

        proxy_cache_bypass $cache_bypass $http_upgrade;
        proxy_no_cache $cache_bypass;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Rate limits по путям
    location /api/auth { limit_req zone=rl_auth burst=3 nodelay; proxy_pass http://nextjs_backend; }
    location /api/v2 { limit_req zone=rl_api burst=20 nodelay; proxy_pass http://nextjs_backend; }
    location /api/webhooks { limit_req zone=rl_webhooks burst=15 nodelay; proxy_pass http://nextjs_backend; }
    location /admin { limit_req zone=rl_admin burst=10 nodelay; proxy_pass http://nextjs_backend; }
    location /dashboard { limit_req zone=rl_dashboard burst=10 nodelay; proxy_pass http://nextjs_backend; }

    # SSE (support chat stream) — специфичный путь ПЕРЕД общим /api/support
    location /api/support/stream {
        limit_conn conn_sse 50;
        proxy_pass http://nextjs_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /api/support { limit_req zone=rl_support burst=5 nodelay; proxy_pass http://nextjs_backend; }
    location /api/upload { 
        limit_req zone=rl_upload burst=3 nodelay;
        client_max_body_size 10M;
        proxy_pass http://nextjs_backend;
    }

    # Default
    location / {
        limit_req zone=rl_general burst=30 nodelay;
        proxy_pass http://nextjs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
